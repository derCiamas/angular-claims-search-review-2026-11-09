<main class="page">
  <section class="search-panel">
    <h1>Claims</h1>
    <label for="claim-search">Search claims</label>
    <input id="claim-search" type="search" [formControl]="searchControl"
           placeholder="Search by claim number or customer">

    <p class="loading" *ngIf="loading">Loading claims…</p>

    <ul class="results" *ngIf="!loading && results.length">
      <li *ngFor="let claim of results">
        <strong>{{ claim.claimNumber }}</strong>
        <span>{{ claim.customerName }} · {{ claim.status }}</span>
      </li>
    </ul>

    <p class="empty" *ngIf="!loading && !results.length">No claims found.</p>
  </section>
</main>
